networks:
  mentoring-net:
    name: mentoring-net
    external: false

services:
  app:
    # Локально: docker compose up --build собирает образ из исходников.
    # На сервере: docker compose pull app тянет готовый образ из GHCR —
    # именно так его обновляет .github/workflows/deploy.yml.
    image: ghcr.io/krytanyc/rag-service:latest
    build: .
    container_name: rag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    # Кэш эмбеддера: переиндексация внутри контейнера
    # (python -m app.scripts.load_corpus && index_corpus) не качает модель заново.
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - mentoring-net
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant
    # Только localhost: приложение ходит в Qdrant по внутренней compose-сети
    # (QDRANT_URL=http://qdrant:6333), а Qdrant без аутентификации, выставленный
    # наружу, — это чтение и удаление коллекций для кого угодно.
    # С ноутбука удобнее через туннель: ssh -L 6333:127.0.0.1:6333 user@server
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - mentoring-net
    restart: unless-stopped

volumes:
  # Именованный том, который монтируется в app (см. services.app.volumes).
  # Без объявления здесь Compose падает: "refers to undefined volume hf_cache".
  hf_cache: